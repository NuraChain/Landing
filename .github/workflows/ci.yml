# Every stage runs against the repository alone - no secrets, no services, no network.
#
# That is a property of the test suite rather than a limitation of the workflow: the three
# upstreams this site reads (the Nura RPC, the Nura explorer, CoinGecko) are stubbed at
# `fetch` in every spec, so CI can never go red because a third party had a bad minute.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch cancels the run it superseded.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep this in step with the `engines.node` floor in package.json.
  NODE_VERSION: '22'

jobs:
  check:
    name: Typecheck and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # `azeroth check` is typecheck plus lint in one pass, over .ts and .azeroth alike.
      - name: Typecheck and lint
        run: npm run check

  test:
    name: Tests and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # Thresholds live in vite.config.ts, so a real coverage drop fails here.
      - name: Run tests with coverage
        run: npm run coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: application/coverage/
          retention-days: 14

  determinism:
    name: Determinism
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # The suite has no sleeps, no real clock and no live network, so running it twice must
      # produce the same result. A test that only passes on a warm cache, or that leaks state
      # into the next file, shows up here rather than as an intermittent failure later.
      # `--sequence.shuffle` also catches order dependence between files.
      # Through the workspace scripts, NOT a bare `npx vitest`. There is no vitest config at
      # the repository root - the two halves each carry their own, and the browser half needs
      # its happy-dom environment and its setup file. Run from here, vitest found the specs,
      # loaded neither, and failed 27 of them; this job had been red since the split.
      - name: Run the suite twice, second time shuffled
        run: |
          npm test
          npm run test:shuffle

  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      # A smoke check on the artefacts themselves: the client bundle must exist, the SSR
      # bundle the server imports by name must exist beside it, and the pre-paint script
      # that settles `dir`/`lang`/theme before first paint must survive into the built HTML.
      - name: Smoke-check the bundles
        run: |
          test -f application/dist/index.html || { echo "application/dist/index.html missing"; exit 1; }
          test -f application/dist-server/entry.server.js || { echo "SSR bundle missing - the server imports it by path"; exit 1; }
          grep -q "documentElement.dir" application/dist/index.html || { echo "pre-paint direction script missing from build"; exit 1; }
          grep -q "documentElement.dataset.theme" application/dist/index.html || { echo "pre-paint theme script missing from build"; exit 1; }
          echo "client ok: $(du -sh application/dist | cut -f1), ssr ok: $(du -sh application/dist-server | cut -f1)"

      - name: Upload bundle
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: |
            application/dist/
            application/dist-server/
          retention-days: 14
