<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <title>Nura Chain — an open and decentralized blockchain</title>
        <meta name="description" content="Nura Chain is an open and decentralized blockchain. Chain ID, RPC endpoint, block explorer, tokenomics, and the Nura Wallet for every device."/>
        <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f8fa"/>
        <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b1118"/>
        <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"/>
        <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png"/>
        <link rel="icon" type="image/png" sizes="512x512" href="/icon.png"/>
        <link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
        <link rel="stylesheet" href="/src/styles.css"/>

        <!-- Runs BEFORE first paint, which is the entire point: resolving the theme in the
             app would paint the default first and repaint on hydration, and that flash is
             the most visible bug a themed site can ship. The key and the attribute name
             must match `THEME_KEY` and the effect in src/stores/theme.ts. Same reasoning
             for `dir`: setting it after hydration reflows the whole page in Persian or
             Arabic. Both lists must match `LOCALES` and `RTL` in src/stores/locale.ts. -->
        <script>
            (function ()
            {
                try
                {
                    var themes = ['dark', 'light', 'contrast'];
                    var saved = localStorage.getItem('nura.theme');
                    var theme = themes.indexOf(saved) === -1
                        ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
                        : saved;

                    document.documentElement.dataset.theme = theme;

                    var locales = ['en', 'fa', 'ar', 'es', 'pt', 'hi', 'zh', 'ru', 'fr', 'tr'];
                    var rtl = ['fa', 'ar'];
                    var locale = localStorage.getItem('nura.locale');

                    if (locales.indexOf(locale) === -1)
                    {
                        locale = 'en';

                        var tags = navigator.languages || [];

                        for (var i = 0; i < tags.length; i++)
                        {
                            var primary = tags[i].toLowerCase().split('-')[0];

                            if (locales.indexOf(primary) !== -1)
                            {
                                locale = primary;
                                break;
                            }
                        }
                    }

                    document.documentElement.lang = locale;
                    document.documentElement.dir = rtl.indexOf(locale) === -1 ? 'ltr' : 'rtl';
                }
                catch (error)
                {
                    document.documentElement.dataset.theme = 'dark';
                }
            })();
        </script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.azeroth" defer></script>
    </body>
</html>
